apis:
- aid: good-energy:good-energy-customer-identity-openid-connect
  name: Good Energy Customer Identity (OpenID Connect)
  description: >-
    The OpenID Connect / OAuth 2.0 identity provider behind Good Energy's customer hub at
    account.goodenergy.co.uk. It is NOT a developer-facing API and Good Energy publishes no
    documentation for it — it is listed here only because its discovery metadata is served
    anonymously and machine-readably at https://login.goodenergy.co.uk/.well-known/openid-configuration
    (HTTP 200, application/json, fetched 2026-07-27), making it the only harvestable API contract the
    company exposes. The document advertises a Duende IdentityServer style surface with
    authorization, token, userinfo, introspection, revocation, device-authorization, CIBA and PAR
    endpoints, PKCE (S256), DPoP signing algorithms, and the scopes openid, profile, email,
    offline_access, customer_portal and customer_portal_tariff_switch. There is no
    registration_endpoint, so no third party can obtain a client; access is customer-account-required.
  humanURL: https://account.goodenergy.co.uk/
  baseURL: https://login.goodenergy.co.uk
  tags:
  - Energy
  - United Kingdom
  - Identity
  - OpenID Connect
  - OAuth
  - Customer Portal
  properties:
  - type: OpenIDConnectDiscovery
    url: authentication/good-energy-openid-configuration.json
  - type: JWKS
    url: authentication/good-energy-openid-jwks.json
  - type: Authentication
    url: https://login.goodenergy.co.uk/.well-known/openid-configuration
  - type: SignIn
    url: https://account.goodenergy.co.uk/
