name: Good Energy
kind: company
description: >-
  Good Energy is a British renewable energy supplier and green-technology installer founded in 1999
  and headquartered in Chippenham, Wiltshire, acquired outright by Abu Dhabi based Esyasoft Investment
  Holding in March 2025 for GBP 99.4 million. It sits on the retail edge of the GB electricity value
  chain: a licensed supplier buying 100% renewable power directly from more than 2,000 British
  generators, the largest voluntary administrator of the Feed-in Tariff, an export/Smart Export
  Guarantee counterparty, and an installer of solar, batteries, heat pumps and EV chargers. Its API
  posture is honest and thin. The United Kingdom mandated smart-metering INFRASTRUCTURE, not a
  consumer data right: Good Energy is a Balancing and Settlement Code and Retail Energy Code party
  operating DCC-adopted SMETS2 smart meters — verified through an Ofgem regulatory-sandbox decision
  naming Good Energy Ltd and through Elexon BSC modification P459, which Good Energy itself raised to
  allow different supplier agents on import and export MSIDs where DCC-adopted smart meters are
  installed. That obligation produces no public API whatsoever. There is no UK equivalent of the
  Australian Consumer Data Right binding Good Energy, no Green Button, and no accredited-recipient
  scheme. No developer portal exists (developer., developers., docs. and data. subdomains do not
  resolve; /developers, /api and /docs return 404). Both sides are closed: consumer usage and billing
  data are reachable only by the account holder through the login-gated customer hub, and no open
  grid or market data is published — GB open energy data comes from NESO, Elexon and the DNOs, not
  from the supplier. The single machine-readable API artifact Good Energy exposes anonymously is the
  OpenID Connect discovery document of its customer-login identity provider.
