  identity provider. There is no OpenAPI to derive securitySchemes from — Good Energy publishes no
  developer-facing API — so this profile describes the ONLY authenticated surface the company exposes
  anonymously in machine-readable form. It is a customer portal login, not a developer API auth
  model: there is no registration_endpoint, so dynamic client registration is unavailable and no
  third party can obtain a client. Access is customer-account-required.
