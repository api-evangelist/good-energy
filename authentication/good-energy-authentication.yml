observations:
- >-
  Legacy grants are still advertised alongside modern ones — implicit and resource-owner password
  remain in grant_types_supported, and plain is still an accepted PKCE code_challenge_method.
- No mTLS / private_key_jwt client authentication is advertised; only client_secret_basic and
  client_secret_post.
- No registration_endpoint, so there is no self-serve or dynamic path to a client_id for a third
  party — the surface is closed to developers by construction, not by policy statement.
