openapi:
  harvested: false
  count: 0
  note: >-
    No OpenAPI, Swagger, AsyncAPI, GraphQL SDL or Postman collection is published or retrievable.
    The openapi/ directory is deliberately absent because nothing real was found — nothing was
    generated, inferred, or invented.

findings:
  summary: |
    Good Energy is a clean control case for the central question of the energy sector: a mandate is
    not an implementation, and an implemented mandate is not necessarily an API.

    Britain regulated the pipes, not the data right. Good Energy carries a real, live, verifiable
    smart-metering infrastructure obligation — it is a BSC and REC party, it operates DCC-adopted
    SMETS2 meters, and it has been active enough inside that machinery to raise Elexon BSC
    modification P459 and to take a derogation request to an Ofgem regulatory sandbox. Every bit of
    that is verified against regulator and code-body records rather than company marketing. And none
    of it surfaces as a single callable endpoint.

    On the consumer side the honest answer is that no mandate applies at all. There is no UK
    Consumer Data Right for energy, no Green Button, no accreditation regime, and therefore no
    designation to be "not live" against. Good Energy is not non-compliant; there is simply nothing
    to comply with, and it has built nothing voluntarily.

    On the market-data side Good Energy publishes nothing open. It is a supplier, not a network or
    system operator, so Britain's genuinely open energy data (NESO Carbon Intensity, Elexon BMRS,
    DNO portals) sits with other parties. Closed on consumer data, closed on market data — the split
    that usually produces the interesting finding collapses here into uniform closure.

    The comparison that matters is Octopus Energy: identical regulator, identical codes, identical
    smart-meter obligation, and a real self-serve developer portal with REST and GraphQL Kraken APIs
    licensed to utilities worldwide. The gap between the two GB suppliers is entirely a product
    decision. Regulation explains neither of them.

    The one machine-readable contract Good Energy exposes anonymously is the OpenID Connect
    discovery document of its customer-login identity provider — portal scopes for billing and
    tariff switching, no dynamic client registration, no way in for a third party. That artifact is
    captured verbatim, and it is the whole of the company's public API surface.
  apisListed: 1
  apiSurfaceIsDeveloperFacing: false
  status: built-stub
